name: Build and verify package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet restore NetReact.DevRunner.slnx
      - run: dotnet build NetReact.DevRunner.slnx -c Release --no-restore
      - run: dotnet pack src/NetReact.DevRunner.Cli -c Release --no-build -o artifacts/nuget
      - name: Verify the installed tool and documented configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $shim = if ($IsWindows) { 'netreact.exe' } else { 'netreact' }
          foreach ($major in 10, 11) {
            $install = "./artifacts/tools-$major"
            dotnet tool install --tool-path $install NetReact.DevRunner --source ./artifacts/nuget --framework "net$major.0"
            $tool = Join-Path (Resolve-Path $install) $shim
            if ((& $tool --info | Out-String) -notmatch "Runtime: \.NET $major\.") {
              throw "Expected the .NET $major tool"
            }
          }
          $app = New-Item -ItemType Directory -Path ./artifacts/sample
          dotnet new web --no-restore -o "$app/Backend"
          New-Item -ItemType Directory -Path "$app/frontend" | Out-Null
          '{"scripts":{"dev":"node --version"}}' | Set-Content "$app/frontend/package.json"
          Copy-Item ./devrunner.example.yaml "$app/devrunner.yaml"
          Push-Location $app
          try {
            & $tool validate
            & $tool doctor
            & $tool start frontend --plain
          } finally { Pop-Location }
          $angularApp = New-Item -ItemType Directory -Path ./artifacts/angular-sample
          dotnet new web --no-restore -o "$angularApp/Backend"
          New-Item -ItemType Directory -Path "$angularApp/frontend" | Out-Null
          '{"scripts":{"start":"node --version"}}' | Set-Content "$angularApp/frontend/package.json"
          '{}' | Set-Content "$angularApp/frontend/angular.json"
          Push-Location $angularApp
          try {
            & $tool init
            if ((Get-Content devrunner.yaml -Raw) -notmatch 'args: \[start\]') {
              throw 'Expected npm start for an Angular workspace'
            }
            & $tool doctor
            & $tool start frontend --plain
          } finally { Pop-Location }
